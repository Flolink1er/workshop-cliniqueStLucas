<app-header class="sticky top-0 z-1" />
<main class="table h-full grow">
  <router-outlet />
</main>
@if (isLogged()) {
  <app-footer />
}

@if (toast.isShown) {
  <div role="alert" class="alert" [class]="toastClass()">
    <span class="alert-icon">{{ toast.icon }}</span>
    <div class="alert-content">
      <b>{{ toast.title() }}</b>
      <p>{{ toast.message() }}</p>
    </div>
  </div>
}
