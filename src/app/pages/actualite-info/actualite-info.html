<div class="flex w-full justify-center px-4 pt-6 md:px-6 md:pt-10">
  <img
    src="{{ currentActu?.image }}"
    alt="Image actualité"
    class="max-h-[500px] w-full max-w-5xl rounded-lg object-cover shadow-md" />
</div>

<div class="mx-auto flex w-full max-w-4xl flex-col px-4 py-6 md:px-6">
  <h1 class="text-3xl font-bold">
    {{ currentActu?.title }}
  </h1>

  <div class="mt-5 flex flex-wrap items-center gap-2 text-xs text-base-content">
    <span class="font-semibold">Tags :</span>

    @for (tag of currentActu?.tags; track tag) {
      <div class="rounded-full bg-accent px-3 py-1 text-accent-content">
        {{ tag }}
      </div>
    }
  </div>

  <div class="divider"></div>

  <div class="prose max-w-none">
    <p class="whitespace-pre-line">
      {{ currentActu?.content }}
    </p>
  </div>

  <i class="mt-6 self-end text-right text-xs text-base-content/70">
    Publié le
    {{ currentActu?.publishedAt | date: 'd MMMM y' }}
    par
    {{ currentActu?.author }}
  </i>
</div>
