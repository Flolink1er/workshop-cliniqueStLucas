<app-hero title="Notre Équipe Médicale" [searchField]="searchInput" />

@if (pageData$ | async; as team) {
  <div class="flex flex-col items-center gap-4 py-4 text-center">
    <div class="max-w-6xl overflow-x-hidden">
      <table class="table">
        <thead>
          <tr>
            <th>Nom</th>
            <th>Spécialisation</th>
            <th>Langues</th>
            <th></th>
          </tr>
        </thead>
        <tbody>
          @for (member of team; track member.id) {
            <tr>
              <td>
                <div class="flex items-center gap-3">
                  <div class="avatar">
                    <div class="mask h-12 w-12 mask-squircle">
                      <img [src]="member.avatar" alt="Avatar Tailwind CSS Component" />
                    </div>
                  </div>
                  <div>
                    <div class="font-bold"
                      >{{ member.title }} {{ member.firstName }} {{ member.lastName }}</div
                    >
                    <!-- <div class="text-sm opacity-50">United States</div> -->
                  </div>
                </div>
              </td>
              <td>
                <!-- Zemlak, Daniel and Leannon -->
                <!-- <br /> -->
                <span class="badge badge-ghost badge-sm">{{ member.specialty }}</span>
              </td>
              <td>{{ member.languages.sort().join(', ') }}</td>
              <th>
                <button class="btn btn-ghost btn-xs" routerLink="/team/{{ member.id }}"
                  >Détails</button
                >
              </th>
            </tr>
          }
        </tbody></table
      >
    </div>
  </div>
  <router-outlet />
}
