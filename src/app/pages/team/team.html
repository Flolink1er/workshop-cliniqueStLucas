<app-hero title="Notre Équipe Médicale" [searchField]="searchInput" />

@if (pageData$ | async; as team) {
  <div
    class="grid-col-1 mx-auto grid gap-4 p-4 sm:max-sm:w-md md:grid-cols-2 xl:w-7xl xl:grid-cols-3">
    @for (doc of team; track doc.id) {
      <app-doctor-card class="size-full" [doctor]="doc" />
    }
  </div>

  <router-outlet />
}
