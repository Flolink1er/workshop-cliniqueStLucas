@if (homeData$ | async; as pageData) {
  <div>
    <app-hero
      tag="Clinique Saint-Lucas · Bruxelles"
      [title]="pageData.hero.title"
      [subtitle]="pageData.hero.subtitle"
      [actions]="[pageData.hero.cta, pageData.hero.ctaSecondary]" />

    <div class="mx-auto flex max-w-4xl flex-col gap-y-6 py-6">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
        @for (stat of pageData.stats; track stat) {
          <app-stat-card [icon]="stat.icon!" [label]="stat.label!" [value]="stat.value" />
        }
      </div>
      <div class="grid grid-cols-1 justify-items-center gap-4 sm:grid-cols-2 lg:grid-cols-3">
        @for (section of pageData.sections; track section) {
          <app-info-card [sectionInfo]="section" class="size-full" />
        }
      </div>
    </div>
  </div>
} @else {
  <app-loader />
}
