@if (homeData$ | async; as pageData) {
  <div>
    <app-hero
      tag="Clinique Saint-Lucas · Bruxelles"
      [title]="pageData.hero.title"
      [subtitle]="pageData.hero.subtitle"
      [actions]="[
        { label: pageData.hero.cta.label, href: pageData.hero.cta.href, type: 'router' },
        {
          label: pageData.hero.ctaSecondary.label,
          href: pageData.hero.ctaSecondary.href,
          type: 'router',
        },
      ]" />

    <div class="bg-base-100 py-12">
      <div class="mx-auto grid max-w-4xl grid-cols-1 gap-4 px-4 sm:grid-cols-2">
        @for (stat of pageData.stats; track stat) {
          <app-stat-card [icon]="stat.icon!" [label]="stat.label!" [value]="stat.value" />
        }
      </div>
      <div
        class="mx-auto my-6 grid w-full max-w-4xl grid-cols-1 justify-items-center gap-4 px-4 sm:grid-cols-2 sm:px-4 lg:grid-cols-3">
        @for (section of pageData.sections; track section) {
          <app-info-card [sectionInfo]="section" class="size-full" />
        }
      </div>
    </div>
  </div>
}
