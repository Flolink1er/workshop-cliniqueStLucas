<form
  [formGroup]="loginForm"
  (submit)="login(loginForm.controls.email.value!, loginForm.controls.password.value!)">
  <fieldset class="fieldset w-xs rounded-box border border-base-300 bg-base-200 p-4">
    <legend class="fieldset-legend">Login</legend>

    <label class="label" for="email">Email</label>
    <input type="email" id="email" class="input" placeholder="Email" formControlName="email" />

    <label class="label" for="password">Password</label>
    <input
      type="password"
      id="password"
      class="input"
      placeholder="Password"
      formControlName="password" />

    <button type="submit" class="btn mt-4 btn-neutral">Login</button>
  </fieldset>
</form>
