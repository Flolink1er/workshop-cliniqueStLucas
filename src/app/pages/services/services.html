<div class="hero bg-base-200">
  <div class="hero-content text-center">
    <div class="max-w-md">
      <h1 class="text-5xl font-bold">Services</h1>
      <label class="input my-6 w-80">
        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor">
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </g>
        </svg>
        <input [formControl]="searchInput" type="search" class="grow" placeholder="Search" />
      </label>
    </div>
  </div>
</div>
@if (pageData$ | async; as pageData) {
  <div class="flex flex-col gap-4 p-4 md:p-8">
    @for (service of pageData; track service.id) {
      <div class="card card-side w-full bg-base-100 shadow-sm md:w-xl md:even:self-end">
        <figure>
          <img
            class="aspect-3/4 w-24 object-cover object-center md:w-48"
            [src]="service.image"
            alt="Service" />
        </figure>
        <div class="card-body">
          <h2 class="card-title">{{ service.name }}</h2>
          <p>{{ service.shortDescription }}</p>
          <div class="card-actions justify-end">
            <button class="btn btn-primary" routerLink="/services/{{ service.id }}">Détails</button>
          </div>
        </div>
      </div>
    }
  </div>
}
