<app-hero title="Services" [searchField]="searchInput" />

@if (pageData$ | async; as pageData) {
  <div
    class="mx-auto grid grid-cols-1 gap-4 p-4 sm:grid-cols-2 md:w-2xl lg:w-full lg:grid-cols-3 xl:w-5xl">
    @for (service of pageData; track service.id) {
      <app-info-card tag="service" [serviceInfo]="service" />
    }
  </div>
}
