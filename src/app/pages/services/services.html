<app-hero title="Services" [searchField]="searchInput" />

@if (pageData$ | async; as pageData) {
  <div class="flex flex-col gap-4 p-4 md:p-8">
    @for (service of pageData; track service.id) {
      <div class="card card-side w-full bg-base-100 shadow-sm md:w-xl md:even:self-end">
        <figure>
          <img
            class="aspect-3/4 w-24 object-cover object-center md:w-48"
            [src]="service.image"
            alt="Service" />
        </figure>
        <div class="card-body">
          <h2 class="card-title">{{ service.name }}</h2>
          <p>{{ service.shortDescription }}</p>
          <div class="card-actions justify-end">
            <button class="btn btn-primary" routerLink="/services/{{ service.id }}">Détails</button>
          </div>
        </div>
      </div>
    }
  </div>
}
