<div class="hero min-h-full bg-base-200">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">Contactez Nous!</h1>
      <p class="py-6">
        Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi exercitationem
        quasi. In deleniti eaque aut repudiandae et a id nisi.
      </p>
    </div>
    <div class="card w-full max-w-sm shrink-0 bg-base-100 shadow-2xl">
      <form [formGroup]="contactForm" (submit)="send()" class="card-body">
        <fieldset class="fieldset">
          <label class="label text-black" for="email">Email *</label>
          <input
            required
            type="email"
            id="email"
            class="input w-full text-black"
            formControlName="email"
            placeholder="Email…" />
          <div class="flex gap-x-2">
            <span>
              <label class="label text-black" for="firstname">Prénom *</label>
              <input
                required
                type="text"
                id="firstname"
                class="input text-black"
                formControlName="firstName"
                placeholder="Prénom…" />
            </span>
            <span>
              <label class="label text-black" for="lastname">Nom *</label>
              <input
                required
                type="text"
                id="lastname"
                class="input text-black"
                formControlName="lastName"
                placeholder="Nom…" />
            </span>
          </div>
          <label class="label text-black" for="subject">Sujet *</label>
          <input
            required
            type="text"
            id="subject"
            class="input w-full text-black"
            formControlName="subject"
            placeholder="Sujet…" />
          <label class="label text-black" for="message">Message *</label>
          <textarea
            required
            id="message"
            class="textarea w-full resize-none text-black"
            formControlName="message"
            placeholder="Message…"></textarea>
          <button
            [disabled]="contactForm.invalid"
            class="btn mt-4 bg-primary btn-neutral disabled:bg-gray-400"
            >Contactez Nous</button
          >
        </fieldset>
      </form>
    </div>
  </div>
</div>
