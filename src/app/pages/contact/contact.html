<div class="hero min-h-full bg-base-200">
  <div class="hero-content flex-col lg:flex-row-reverse">
    <div class="text-center lg:text-left">
      <h1 class="text-5xl font-bold">Contactez Nous!</h1>
      <p class="py-6">
        Provident cupiditate voluptatem et in. Quaerat fugiat ut assumenda excepturi exercitationem
        quasi. In deleniti eaque aut repudiandae et a id nisi.
      </p>
    </div>
    <div class="card w-full max-w-sm shrink-0 bg-base-100 shadow-2xl">
      <form [formGroup]="contactForm" (submit)="send()" class="card-body">
        <fieldset class="fieldset">
          <label class="label" for="email">Email</label>
          <input
            type="email"
            id="email"
            class="input w-full"
            formControlName="email"
            placeholder="Email…" />
          <div class="flex gap-x-2">
            <span>
              <label class="label" for="firstname">Prénom</label>
              <input
                type="text"
                id="firstname"
                class="input"
                formControlName="firstName"
                placeholder="Prénom…" />
            </span>
            <span>
              <label class="label" for="lastname">Nom</label>
              <input
                type="text"
                id="lastname"
                class="input"
                formControlName="lastName"
                placeholder="Nom…" />
            </span>
          </div>
          <label class="label" for="subject">Sujet</label>
          <input
            type="text"
            id="subject"
            class="input w-full"
            formControlName="subject"
            placeholder="Sujet…" />
          <label class="label" for="message">Message</label>
          <textarea
            id="message"
            class="textarea w-full resize-none"
            formControlName="message"
            placeholder="Message…"></textarea>
          <button [disabled]="contactForm.invalid" class="btn mt-4 btn-neutral"
            >Contactez Nous</button
          >
        </fieldset>
      </form>
    </div>
  </div>
</div>
