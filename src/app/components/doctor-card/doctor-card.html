<div class="flex size-full flex-col justify-between rounded-[20px] bg-white shadow-sm">
  <div class="flex w-full items-center gap-x-4 p-6">
    <img
      class="aspect-square size-18 rounded-full object-cover object-center"
      [src]="doctor().avatar"
      alt="" />
    <div class="flex flex-col gap-y-1">
      <span class="text-[17px] font-bold">
        {{ doctor().title }} {{ doctor().firstName }} {{ doctor().lastName }}
        @if (isHead()) {
          <span class="badge">Médecin en chef</span>
        }
      </span>
      <span class="text-[13px] font-semibold text-accent">{{ doctor().specialty }}</span>
      <span class="text-[13px] text-(--color-light-content)">{{
        doctor().languages.join(', ')
      }}</span>
    </div>
  </div>
  <div class="card-actions justify-end border-t border-t-(--border-main) px-5 py-3.5">
    <button class="btn btn-sm btn-outline" routerLink="/team/{{ doctor().id }}">Détails</button>
  </div>
</div>
